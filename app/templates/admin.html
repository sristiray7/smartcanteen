{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<div class="admin-page">
    <header class="admin-page-header">
        <h2>Admin Dashboard</h2>
        <p>Manage your restaurant: orders, menu, and more.</p>
    </header>

    <section class="admin-stats-grid" data-aos="fade-up">
        
        <article class="admin-card" data-aos="zoom-in">
            <h3>📋 Menu Management</h3>
            <p>Add, edit, and delete menu items</p>
            <a href="{{ url_for('menu') }}" class="btn btn-outline btn-xs">Manage Menu</a>
        </article>

        <article class="admin-card" data-aos="zoom-in" data-aos-delay="60">
            <h3>📦 Orders</h3>
            <p>View and manage customer orders</p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline btn-xs">View Orders</a>
        </article>
    </section>
</div>
{% endblock %}
